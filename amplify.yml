version: 1
applications:
  - appRoot: deepmotive-frontend       
    frontend:
      phases:
        preBuild:
          commands:
            - npm install
        build:
          commands:
            - "echo 'VITE_API_URL=http://habit-public-alb-2050879591.eu-central-1.elb.amazonaws.com' > .env"
            - "cat .env | grep VITE"
            - npm run build
      artifacts:
        baseDirectory: dist            
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*