# amplify.yml (repo root mein rakho)
version: 1
applications:
  - appRoot: deepmotive-frontend       
    frontend:
      phases:
        preBuild:
          commands:
            - npm install
            - ls -la
            - cat .env || echo "No .env file found"
        build:
          commands:
            - echo "VITE_API_URL from env: $VITE_API_URL"
            - cat .env || echo "Still no .env"
            - npm run build
      artifacts:
        baseDirectory: dist            
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*